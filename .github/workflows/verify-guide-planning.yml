name: Verify guide planning navigation
on:
  push:
    branches: [verify/guide-planning-2026-11-16]
permissions:
  contents: read
env:
  CI: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e431770fbb89ace35e61237f61ff6175cb00b0bc
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify main flows and guide planning in both sizes
        run: pnpm exec playwright test e2e/guide-navigation.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-planning-evidence
          path: test-results/
          retention-days: 7
